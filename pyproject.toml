[project]
name = "sls-api"
version = "2.4.0"
description = "FastAPI for the SousLeSens project"
authors = [{ name = "Logilab" }]
requires-python = ">=3.11,<4"
readme = "README.md"
license = "MIT"
dependencies = [
    "fastapi>=0.104.1,<0.105",
    "uvicorn[standard]>=0.24.0.post1,<0.25",
    "python-multipart>=0.0.6,<0.0.7",
    "python-ulid>=2.2.0,<3",
    "rdflib>=7.0.0,<8",
    "requests>=2.31.0,<3",
    "colorlog>=6.7.0,<7",
    "sparqlwrapper>=2.0.0,<3",
    "pyodbc>=5.1.0,<6",
    "dateparser>=1.2.2,<2",
]

[dependency-groups]
dev = [
    "black>=23.11.0,<24",
    "pytest>=7.4.3,<8",
    "release-new>=0.16.0,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
